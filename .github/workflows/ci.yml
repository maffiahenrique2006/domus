name: MVP checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: node lib/db/tests/workspace.test.mjs
      - run: node --test artifacts/api-server/tests/billing*.test.mjs
      - run: pnpm --filter @workspace/domus run build
        env:
          PORT: 5000
          BASE_PATH: /
          NODE_ENV: production
      - run: node artifacts/api-server/build-vercel.mjs
